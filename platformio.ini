; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html
[platformio]

[env]
monitor_speed = 19200

[env:test_nanoatmega328] # Enviroment for testing
platform = atmelavr
board = nanoatmega328
board_build.f_cpu = 16000000L

[env:example_ds18b20_Atmega328] # Enviroment for DS18B20 example
platform = atmelavr
board = nanoatmega328
board_build.f_cpu = 16000000L
build_src_filter =
    +<*>
    +<../examples/ds18b20_Atmega328/main.cpp>
    -<main.cpp>

[env:example_ds18b20_stm32f0_disco]
platform = ststm32
board = disco_f051r8
framework = cmsis
board_build.f_cpu = 48000000L
upload_protocol = stlink
debug_tool = stlink
build_flags = 
    -std=gnu++17
    -DSTM32F0
    -DSTM32F051x8
build_src_filter =
    +<*>
    +<../examples/ds18b20_stm32f0_disco/main.cpp>
    -<main.cpp>